    #         poll_interval_seconds: 30 # default
    #         paths:
    #           - path: /home/taarole8/netgauze-dev/NetGauze/assets/inputs/files/flow2rd-mini-test.map
    #             format: !PmacctMaps
    #               id: mplsVpnRouteDistinguisher
    #           - path: /home/taarole8/netgauze-dev/NetGauze/assets/inputs/files/sampling-nfacctd-bxp.map
    #             format: !PmacctMaps
    #               id: samplerRandomInterval
    #               weight: 200
    #           - path: /home/taarole8/netgauze-dev/NetGauze/assets/inputs/files/json-ops.jsonl
    #             format: !FlowUpserts
    #           - path: /home/taarole8/netgauze-dev/NetGauze/assets/inputs/files/cache-dump.jsonl
    #             format: !FlowUpserts
    #       kafka:
    #         consumers:
    #           - topic: sonata
    #             message_format: !Sonata
    #               weight: 100
    #             consumer_config:
    #               bootstrap.servers: localhost:49092
    #               group.id: taarole8-rocky8-json
    #               enable.auto.commit: "false"
    #               auto.offset.reset: earliest
    #               # enable.partition.eof: true
    #           - topic: json-ops
    #             message_format: !FlowEnrichmentOps
    #             consumer_config:
    #               bootstrap.servers: localhost:49092
    #               group.id: taarole8-rocky8-json
    #               enable.auto.commit: "false"
    #               auto.offset.reset: earliest
    #   aggregation:
    #     window_duration:
    #       secs: 60
    #       nanos: 0 # check or remove nanos if not working
    #     lateness:
    #       secs: 10
    #       nanos: 0
    #     transform:
    #       # Key Fields
    #       sourceIPv4Address: Key
    #       destinationIPv4Address: Key
    #       sourceIPv6Address: Key
    #       destinationIPv6Address: Key
    #       protocolIdentifier: Key
    #       sourceTransportPort: Key
    #       destinationTransportPort: Key
    #       flowDirection: Key
    #       sourceMacAddress: Key
    #       destinationMacAddress: Key
    #       layer2SegmentId: Key
    #       icmpTypeIPv4: Key
    #       applicationName: Key
    #       applicationDescription: Key
    #       classificationEngineId: Key
    #       observationPointType: Key
    #       observationDomainName: Key
    #       virtualStationName: Key
    #       !VMWare tenantSourceIPv4: Key
    #       !VMWare tenantDestIPv4: Key
    #       !VMWare tenantSourcePort: Key
    #       !VMWare tenantDestPort: Key
    #       !VMWare tenantProtocol: Key
    #       !VMWare virtualObsID: Key
    #       !VMWare vmUuid:
    #         0: Key
    #         # 1: Add
    #       !NetGauze dataCollectionManifestName: Key
    #       !NetGauze nodeId: Key
    #       !NetGauze platformId: Key
    #       samplerName: Key
    #       selectorAlgorithm: Key
    #       samplingSize: Key
    #       samplingPopulation: Key
    #       samplingPacketSpace: Key
    #       samplingPacketInterval: Key
    #       samplerRandomInterval: Key
    #       ingressInterface: Key
    #       !NetGauze ingressInterfaceName: Key
    #       !NetGauze ingressInterfaceDescription: Key
    #       egressInterface: Key
    #       !NetGauze egressInterfaceName: Key
    #       !NetGauze egressInterfaceDescription: Key
    #       ingressVRFID: Key
    #       !NetGauze ingressVRFname: Key
    #       !NetGauze ingressMplsVpnRouteDistinguisher: Key
    #       egressVRFID: Key
    #       !NetGauze egressVRFname: Key
    #       !NetGauze egressMplsVpnRouteDistinguisher: Key
    #       # Group-by Fields
    #       octetDeltaCount: Add
    #       packetDeltaCount: Add
    #       deltaFlowCount: Add
    #       tcpControlBits: BoolMapOr
    #       maximumTTL: Max
    #   endpoints:
    #     main: !FlowKafkaJson
    #       topic: netgauze-flow-json
    #       producer_config:
    #         bootstrap.servers: localhost:49092
    #       writer_id: taarole8_rocky_json_group
    #########################################################
    # Aggregation + converter + avro output publisher
    #########################################################
    agg-avro-publisher:
      shards: 8
      buffer_size: 10000
      enrichment:
        inputs:
          flow_options:
            weight: 16
          files:
            ## TODO: per map option to reload map on-start or on-change (use: case -> load option data at startup only..)
            ## TODO: log message when loading is finished the first time only (for all sources, files when first read successfull, sonata when end of topic is reached the first time...)
            poll_interval_seconds: 30 # default
            paths:
              - path: assets/inputs/files/flow2rd-mini-test.map
                format: !PmacctMaps
                  id: mplsVpnRouteDistinguisher
              - path: assets/inputs/files/sampling-nfacctd-bxp.map
                format: !PmacctMaps
                  id: samplerRandomInterval
                  weight: 200
              - path: assets/inputs/files/json-ops.jsonl
                format: !FlowUpserts
              - path: assets/inputs/files/cache-dump.jsonl
                format: !FlowUpserts
              - path: assets/inputs/files/vmware-node-platform-upserts.jsonl
                format: !FlowUpserts
              - path: assets/inputs/files/vmware-iface-upserts.jsonl
                format: !FlowUpserts
          kafka:
            consumers:
              # TODO: map with string key not list to make it better in ansible
              - topic: sonata
                message_format: !Sonata
                weight: 64 # default: 64
                consumer_config:
                  bootstrap.servers: localhost:49092
                  group.id: taarole8-rocky8-avro
                  enable.auto.commit: "false"
                  auto.offset.reset: earliest
              - topic: json-ops
                message_format: !FlowEnrichmentOps
                consumer_config:
                  bootstrap.servers: localhost:49092
                  group.id: taarole8-rocky8-avro
                  enable.auto.commit: "false"
                  auto.offset.reset: earliest
              - topic: daisy.dev.cosmos-sonata-nodes-json
                message_format: !Sonata
                consumer_config:
                  metadata.broker.list: "kafka.sbd.corproot.net:9093"
                  security.protocol: "ssl"
                  ssl.certificate.location: "/home/taarole8/sbd_ssl/collectors.crt"
                  ssl.key.location: "/home/taarole8/sbd_ssl/collectors.key"
                  ssl.ca.location: "/home/taarole8/sbd_ssl/sbd_root_ca.crt"
                  group.id: daisy.dev.taarole8-rocky8
                  enable.auto.commit: "false"
                  auto.offset.reset: earliest
      aggregation:
        window_duration:
          secs: 60
          nanos: 0 # check or remove nanos if not working
        lateness:
          secs: 10
          nanos: 0
        transform:
          # Key Fields
          sourceIPv4Address: Key
          destinationIPv4Address: Key
          sourceIPv6Address: Key
          destinationIPv6Address: Key
          protocolIdentifier: Key
          sourceTransportPort: Key
          destinationTransportPort: Key
          flowDirection: Key
          sourceMacAddress: Key
          destinationMacAddress: Key
          layer2SegmentId: Key
          icmpTypeIPv4: Key
          !VMWare tenantSourceIPv4: Key
          !VMWare tenantDestIPv4: Key
          !VMWare tenantSourcePort: Key
          !VMWare tenantDestPort: Key
          !VMWare tenantProtocol: Key
          !VMWare virtualObsID: Key
          !VMWare vmUuid:
            0: Key
            # 1: Add
          !NetGauze dataCollectionManifestName: Key
          !NetGauze nodeId: Key
          !NetGauze platformId: Key
          samplerName: Key
          selectorAlgorithm: Key
          samplingSize: Key
          samplingPopulation: Key
          samplingPacketSpace: Key
          samplingPacketInterval: Key
          samplerRandomInterval: Key
          ingressInterface: Key
          !NetGauze ingressInterfaceName: Key
          !NetGauze ingressInterfaceDescription: Key
          egressInterface: Key
          !NetGauze egressInterfaceName: Key
          !NetGauze egressInterfaceDescription: Key
          ingressVRFID: Key
          !NetGauze ingressVRFname: Key
          !NetGauze ingressMplsVpnRouteDistinguisher: Key
          egressVRFID: Key
          !NetGauze egressVRFname: Key
          !NetGauze egressMplsVpnRouteDistinguisher: Key
          # Group-by Fields
          octetDeltaCount: Add
          packetDeltaCount: Add
          deltaFlowCount: Add
          tcpControlBits: BoolMapOr
          maximumTTL: Max
      endpoints:
        # json: !FlowKafkaJson
        #   topic: netgauze-flow-json
        #   producer_config:
        #     bootstrap.servers: localhost:49092
        #     # Prod config
        #     compression.type: "snappy"
        #     queue.buffering.max.messages: "800000"
        #     batch.size: "50000" # HINT: 500000 to increase performance
        #     batch.num.messages: "1000000"
        #     linger.ms: "50"
        #     message.max.bytes: "5242880"
        #     message.timeout.ms: "60000"
        #   writer_id: taarole8_rocky
        flow-full: !FlowKafkaAvro
          topic: netgauze-perftests
          topc:
          schema_registry_url: http://localhost:48081
          # topic: "netgauze-perftests"
          # schema_registry_url: "http://10.250.99.20"
          # topic: "daisy.dev.vmwareflow-avro-raw"
          # schema_registry_url: "https://schema-registry.sbd.corproot.net"
          # topic: "flow-avro-raw"
          # schema_registry_url: "http://10.110.110.249:8088"
          producer_config:
            bootstrap.servers: localhost:49092
            # bootstrap.servers: "b-1.cosmos-kafka.723cyb.c5.kafka.eu-central-1.amazonaws.com:9096,b-2.cosmos-kafka.723cyb.c5.kafka.eu-central-1.amazonaws.com:9096"
            # security.protocol: "sasl_ssl"
            # sasl.mechanism: "SCRAM-SHA-512"
            # sasl.username: "ietf-lab"
            # sasl.password: "m^vy8*F9*Q7z4jPLvek"
            # metadata.broker.list: "kafka.sbd.corproot.net:9093"
            # bootstrap.servers: "kafka.sbd.corproot.net:9093"
            # security.protocol: "ssl"
            # ssl.certificate.location: "/home/taarole8/sbd_ssl/collectors.crt"
            # ssl.key.location: "/home/taarole8/sbd_ssl/collectors.key"
            # ssl.ca.location: "/home/taarole8/sbd_ssl/sbd_root_ca.crt"
            # bootstrap.servers: 10.110.110.249:29092
            # Prod config
            compression.type: "snappy"
            queue.buffering.max.messages: "800000"
            batch.size: "50000" # HINT: 500000 to increase performance
            batch.num.messages: "1000000"
            linger.ms: "50"
            message.max.bytes: "5242880"
            message.timeout.ms: "60000"
          writer_id: taarole8_rocky_vmware_flow_avro # TODO: change to publisher-endpoint-id??
          avro_converter:
            fields:
              # Custom Fields
              ip_src:
                select: !Coalesce
                  ies:
                    - ie: sourceIPv4Address
                      index: 0
                    - ie: sourceIPv6Address
                      index: 0
                transform: String
                default: !String ""
              ip_dst:
                select: !Coalesce
                  ies:
                    - ie: destinationIPv4Address
                      index: 0
                    - ie: destinationIPv6Address
                      index: 0
                transform: String
                default: !String ""
              ip_proto:
                select: !Single
                  ie: protocolIdentifier
                  index: 0
                transform: LowercaseString
                default: !String "0"
              port_src:
                select: !Single
                  ie: sourceTransportPort
                  index: 0
                default: !U16 0
              port_dst:
                select: !Single
                  ie: destinationTransportPort
                  index: 0
                default: !U16 0
              sampling_direction:
                select: !Single
                  ie: flowDirection
                  index: 0
                transform: !Rename
                  ingress: i
                  egress: e
                default: !String ""
              mac_src:
                select: !Single
                  ie: sourceMacAddress
                  index: 0
                transform: String
                default: !String "00:00:00:00:00:00"
              mac_dst:
                select: !Single
                  ie: destinationMacAddress
                  index: 0
                transform: String
                default: !String "00:00:00:00:00:00"
              vxlan:
                select: !Layer2SegmentId
                  ie: layer2SegmentId
                  index: 0
                  encap_type: !VxLAN
                default: !U64 0
              custom_primitives.ipttlmax:
                select: !Single
                  ie: maximumTTL
                  index: 0
                transform: String
                default: !String ""
              custom_primitives.icmptypeipv4:
                select: !Single
                  ie: icmpTypeIPv4
                  index: 0
                transform: String
                default: !String "0"
              custom_primitives.tenantsourceipv4:
                select: !Single
                  ie: !VMWare tenantSourceIPv4
                  index: 0
                transform: String
                default: !String "0.0.0.0"
              custom_primitives.tenantdestipv4:
                select: !Single
                  ie: !VMWare tenantDestIPv4
                  index: 0
                transform: String
                default: !String "0.0.0.0"
              custom_primitives.tenantsourceport:
                select: !Single
                  ie: !VMWare tenantSourcePort
                  index: 0
                transform: String
                default: !String "0"
              custom_primitives.tenantdestport:
                select: !Single
                  ie: !VMWare tenantDestPort
                  index: 0
                transform: String
                default: !String "0"
              custom_primitives.tenantprotocol:
                select: !Single
                  ie: !VMWare tenantProtocol
                  index: 0
                transform: LowercaseString
                default: !String "0"
              custom_primitives.virtualobsid:
                select: !Single
                  ie: !VMWare virtualObsID
                  index: 0
                transform: TrimmedString
                default: !String ""
              custom_primitives.vmuuid:
                select: !Single
                  ie: !VMWare vmUuid
                  index: 0
                transform: String
                default: !String ""
              bytes:
                select: !Single
                  ie: octetDeltaCount
                  index: 0
              packets:
                select: !Single
                  ie: packetDeltaCount
                  index: 0
              flows:
                select: !Single
                  ie: deltaFlowCount
                  index: 0
              tcp_flags:
                select: !Single
                  ie: tcpControlBits
                  index: 0
                transform: StringArray
                default: !StringArray []
              sampler_name:
                select: !Single
                  ie: samplerName
                  index: 0
              sampling_rate:
                select: !Single
                  ie: samplerRandomInterval
                  index: 0
              selector_algo:
                select: !Single
                  ie: selectorAlgorithm
                  index: 0
                transform: String
              in_iface:
                select: !Coalesce
                  ies:
                    - ie: !NetGauze ingressInterfaceName
                      index: 0
                    - ie: ingressInterface
                      index: 0
                transform: String
              in_iface_desc:
                select: !Single
                  ie: !NetGauze ingressInterfaceDescription
                  index: 0
              out_iface:
                select: !Coalesce
                  ies:
                    - ie: !NetGauze egressInterfaceName
                      index: 0
                    - ie: egressInterface
                      index: 0
                transform: String
              out_iface_desc:
                select: !Single
                  ie: !NetGauze egressInterfaceDescription
                  index: 0
              in_vrf:
                select: !Coalesce
                  ies:
                    - ie: !NetGauze ingressVRFname
                      index: 0
                    - ie: ingressVRFID
                      index: 0
                transform: String
              # in_rd:
              #   select: !Single
              #     ie: !NetGauze ingressMplsVpnRouteDistinguisher
              #     index: 0
              #   transform: String
              out_vrf:
                select: !Coalesce
                  ies:
                    - ie: !NetGauze egressVRFname
                      index: 0
                    - ie: egressVRFID
                      index: 0
                transform: String
              # out_rd:
              #   select: !Single
              #     ie: !NetGauze egressMplsVpnRouteDistinguisher
              #     index: 0
              #   transform: String
              # Internal Fields (they will become normal fields once enrich has been fully migrated to before aggr)
              peer_ip_src:
                select: !Coalesce
                  ies:
                    - ie: originalExporterIPv4Address
                      index: 0
                    - ie: originalExporterIPv6Address
                      index: 0
                transform: String
                default: !String ""
              stamp_inserted:
                select: !Single
                  ie: !NetGauze windowStart
                  index: 0
                transform: TimestampMillisString
              stamp_updated:
                select: !Single
                  ie: !NetGauze windowEnd
                  index: 0
                transform: TimestampMillisString
              writer_id:
                select: !Single
                  ie: !NetGauze dataCollectionManifestName
                  index: 0
                transform: String
                default: !String ""
              label:
                select: !Multi
                  ies:
                    - ie: !NetGauze nodeId
                      index: 0
                    - ie: !NetGauze platformId
                      index: 0
                transform: !StringMapAgg
                  !NetGauze nodeId:
                    key_rename: nkey
                  !NetGauze platformId:
                    key_rename: pkey
                    # val_rename:
                    #   platform1: platform1_testing_val_rename
                default: !StringMap { nkey: unknown, pkey: unknown }
