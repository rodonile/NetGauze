runtime:
  # Total number of OS threads used allocated for NetGauze.
  # If not specified, the number of threads will equal the number of CPU cores.
  threads: 24

logging:
  level: info
  ansi: true

telemetry:
  url: http://localhost:4317/v1/metrics
  id: vmware_flow
  exporter_timeout: 2000
  reader_interval: 10000
  reader_timeout: 2000

# TODO: add (then discuss.. avoid duplication? another id here?) --> first try to take the one for publisher config...
# --> idea 1, we have id for the global leve config always applied, then also writer_id to distinguish publisher (in the future
#      we will have 2x publishers e.g. for anonym and full flow...)

flow:
  subscriber_timeout: 100
  template_cache_purge_timeout: 360
  listeners: # TODO: also here do with name (hashmap instead of list)
    - address: "[::]:9992"
      workers: 1
    - address: 0.0.0.0:9991
      interface: trex1
      workers: 4

  # Multiple publishers can be defined.
  # A packet is copied for each publisher group, and load-balancing is defined between endpoints in the same group.
  publishers:
    #########################################################
    # Raw JSON publisher
    #########################################################
    # raw-json-publisher:
    #   enrichment: # TODO: check leaking of config? (--> also the files and kafka inputs stuff ends up here even if not configured for this publisher...??)
    #     inputs:
    #       flow_options:
    #         weight: 16
    #   endpoints:
    #     main: !KafkaJson
